[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plop"
version = "0.1.0"
description = "Adversarial eval harness for LLM agent tool-use (asd-ste100)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cbassey" }]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# The anthropic package is only needed for real runs against the Claude API.
# The mock backend runs offline with no extra dependency.
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
plop-harness = "harness.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
